<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Yougori · My PC</title>
<style>body{font:16px system-ui;max-width:1000px;margin:32px auto;padding:0 20px;background:#101718;color:#e6eeea}button,input,textarea{font:inherit;color:inherit;background:#1c2928;border:1px solid #54706b;border-radius:6px;padding:8px;margin:4px}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}li{display:flex;align-items:center;gap:6px;border-bottom:1px solid #30433f;padding:6px}li>button:first-child{flex:1;text-align:left}textarea{box-sizing:border-box;width:100%;height:50vh;font:14px monospace}a{color:#a5e6d1}#status{white-space:pre-wrap;overflow-wrap:anywhere}ul{padding:0}header{display:flex;align-items:center;justify-content:space-between}small{color:#b8cdc7}</style>
<body data-read-only="__READ_ONLY__"><header><h1>My PC · Shared folder</h1><strong id="permission"></strong></header><small>Access is limited to this selected folder. Keep this URL private. Disconnecting the folder in Yougori revokes access.</small>
<p><button id="up">Parent folder</button><code id="path">/</code></p><div id="actions"><button id="new-file">New file</button><button id="new-folder">New folder</button></div><p id="status" role="status" aria-live="polite"></p><ul id="files"></ul>
<section id="editor" hidden><h2 id="filename"></h2><textarea id="text" aria-label="File contents" spellcheck="false"></textarea><button id="save">Save changes</button><button id="close">Close editor</button><p><small>UTF-8 text files up to 256 KiB. Save checks for changes since the file was opened.</small></p></section>
<script>
'use strict';
const $=id=>document.getElementById(id), token=location.pathname.split('/')[1], readOnly=document.body.dataset.readOnly==='true';
let directory='',opened=null,busy=false;
$('permission').textContent=readOnly?'View Only':'View & Edit'; $('actions').hidden=readOnly; $('save').hidden=readOnly; $('text').readOnly=readOnly;
const encode=bytes=>{let text='';for(const byte of bytes)text+=String.fromCharCode(byte);return btoa(text)};
const decode=text=>Uint8Array.from(atob(text),c=>c.charCodeAt(0));
async function api(operation,path='',fields={}){const response=await fetch('/files',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({operation,path,...fields}),cache:'no-store'});let result;try{result=await response.json()}catch{throw Error('The folder is no longer connected.')}if(!response.ok)throw Error(result.error||'Access denied');return result}
async function perform(action){if(busy)return;busy=true;$('status').textContent='Working…';document.querySelectorAll('button').forEach(b=>b.disabled=true);try{await action();$('status').textContent=''}catch(e){$('status').textContent=e.message}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false)}}
const path=name=>directory?directory+'/'+name:name;
function nameInput(message){const name=prompt(message);if(name===null)return null;if(!name||name==='.'||name==='..'||/[\\/:\x00-\x1f]/.test(name))throw Error('Enter a single file or folder name.');return name}
function closeEditor(){if(opened&&!readOnly&&$('text').value!==opened.text&&!confirm('Discard unsaved changes?'))return false;opened=null;$('editor').hidden=true;return true}
function button(label,action){const element=document.createElement('button');element.textContent=label;element.onclick=()=>perform(action);return element}
async function list(){const result=await api('list',directory);$('path').textContent='/'+directory;$('files').replaceChildren();for(const entry of result.entries.sort((a,b)=>Number(b.directory)-Number(a.directory)||a.name.localeCompare(b.name))){const full=path(entry.name),li=document.createElement('li');li.append(button((entry.directory?'📁 ':'')+entry.name,async()=>{if(!closeEditor())return;if(entry.directory){directory=full;await list();return}if(entry.size>262144)throw Error('This file is too large for the text editor. Use Download or a mounted share.');const result=await api('read',full,{length:262144});const text=new TextDecoder('utf-8',{fatal:true}).decode(decode(result.data));if(text.includes('\0'))throw Error('This is a binary file. Use Download.');opened={path:full,data:result.data,text};$('filename').textContent=entry.name;$('text').value=text;$('editor').hidden=false;}));if(!entry.directory){const link=document.createElement('a');link.textContent='Download';link.href='/'+token+'/'+full.split('/').map(encodeURIComponent).join('/');link.download=entry.name;link.referrerPolicy='no-referrer';li.append(link)}if(!readOnly){li.append(button('Rename',async()=>{const name=nameInput('New name');if(name===null)return;await api('rename',full,{destination:path(name)});await list()}),button('Delete',async()=>{if(confirm('Delete '+entry.name+'? Folders must be empty.')){await api('remove',full);await list()}}))}$('files').append(li)}}
$('up').onclick=()=>perform(async()=>{if(!closeEditor())return;directory=directory.split('/').slice(0,-1).join('/');await list()});
for(const [id,operation]of [['new-file','create'],['new-folder','mkdir']])$(id).onclick=()=>perform(async()=>{const name=nameInput('Name');if(name===null)return;await api(operation,path(name));await list()});
$('save').onclick=()=>perform(async()=>{if(!opened)return;const data=encode(new TextEncoder().encode($('text').value));await api('replace',opened.path,{data,expectedData:opened.data});opened.data=data;opened.text=$('text').value;await list()});
$('close').onclick=closeEditor;addEventListener('beforeunload',e=>{if(opened&&!readOnly&&$('text').value!==opened.text){e.preventDefault();e.returnValue=''}});perform(list);
</script></body></html>
